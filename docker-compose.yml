services:
  api:
    build: .
    container_name: users-api
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      GIN_MODE: release
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - db

  db:
    image: mysql:8.4
    container_name: users-db
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: